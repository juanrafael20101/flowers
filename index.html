<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>For Zully · Flores Amarillas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Playfair+Display:ital,wght@0,600;1,500&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #ffd76a;
    --rose: #ff5fa2;
    --blush: #ffb3d4;
    --cream: #fff6e8;
    --ink: #2a1020;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    overflow: hidden;
    background: #120814;
    color: var(--cream);
    font-family: 'Cormorant Garamond', Georgia, serif;
    -webkit-font-smoothing: antialiased;
  }

  /* ========== INTRO ========== */
  .intro {
    position: fixed; inset: 0; z-index: 100;
    display: grid; place-items: center;
    background: radial-gradient(circle at 50% 40%, #5a1848, #1a0820 70%);
    transition: opacity .8s ease, visibility .8s;
  }
  .intro.gone { opacity: 0; visibility: hidden; pointer-events: none; }
  .intro-card { text-align: center; padding: 2rem; animation: introFloat 3s ease-in-out infinite; }
  @keyframes introFloat {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }
  .intro-seal {
    width: 92px; height: 92px; margin: 0 auto 1rem;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #fff3b0, #f0b429 45%, #c47800);
    display: grid; place-items: center;
    font-family: 'Great Vibes', cursive; font-size: 2rem; color: #5a2040;
    box-shadow: 0 0 0 4px rgba(255,215,106,.25), 0 0 40px rgba(255,95,162,.5);
    animation: sealPulse 1.6s ease-in-out infinite;
  }
  @keyframes sealPulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.08); }
  }
  .intro h2 {
    font-family: 'Great Vibes', cursive;
    font-size: clamp(2.5rem, 8vw, 4rem);
    color: #ffe9a8;
    text-shadow: 0 0 24px rgba(255,95,162,.55);
  }
  .intro .to-her {
    margin-top: .35rem;
    font-size: clamp(1.35rem, 4vw, 1.8rem);
    font-style: italic;
    color: var(--blush);
  }
  .intro p.tag {
    margin-top: .55rem;
    font-size: .95rem;
    letter-spacing: .28em;
    text-transform: uppercase;
    color: rgba(255,179,212,.85);
  }
  .intro-btn {
    margin-top: 1.5rem;
    appearance: none; border: 0; cursor: pointer;
    font-family: inherit; font-size: 1.15rem; font-weight: 600;
    min-height: 48px;
    padding: .85rem 1.8rem; border-radius: 999px;
    background: linear-gradient(135deg, #ff8ec8, var(--rose));
    color: #fff;
    box-shadow: 0 10px 30px rgba(255,95,162,.45);
    animation: ctaBounce 1.8s ease-in-out infinite;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  @keyframes ctaBounce {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.06); }
  }
  .curtain {
    position: absolute; top: 0; bottom: 0; width: 52%;
    background: linear-gradient(180deg, #6b1b4d, #2a0a28);
    z-index: -1;
    transition: transform 1.1s cubic-bezier(.7,0,.3,1);
  }
  .curtain.left { left: 0; border-right: 2px solid rgba(255,215,106,.3); }
  .curtain.right { right: 0; border-left: 2px solid rgba(255,215,106,.3); }
  .intro.gone .curtain.left { transform: translateX(-105%); }
  .intro.gone .curtain.right { transform: translateX(105%); }

  /* ========== STAGE ========== */
  .stage {
    position: relative; height: 100%;
    opacity: 0; transform: scale(1.03);
    transition: opacity 1s .3s ease, transform 1.2s .3s ease;
  }
  .stage.on { opacity: 1; transform: none; }

  .bg {
    position: absolute; inset: 0; overflow: hidden;
    background:
      radial-gradient(ellipse 90% 60% at 50% 110%, rgba(255,95,162,.4), transparent 55%),
      radial-gradient(ellipse 70% 45% at 50% -10%, rgba(255,215,106,.25), transparent 50%),
      linear-gradient(160deg, #2a0a28 0%, #4a1238 30%, #1a1a3a 65%, #0d2f2c 100%);
  }
  .bg::before {
    content: "";
    position: absolute; inset: -30%;
    background: conic-gradient(from 0deg at 50% 58%,
      transparent 0deg, rgba(255,215,106,.16) 14deg, transparent 28deg,
      transparent 60deg, rgba(255,95,162,.14) 74deg, transparent 88deg,
      transparent 120deg, rgba(255,215,106,.14) 134deg, transparent 148deg,
      transparent 180deg, rgba(255,95,162,.12) 194deg, transparent 208deg,
      transparent 240deg, rgba(255,215,106,.14) 254deg, transparent 268deg,
      transparent 300deg, rgba(255,95,162,.12) 314deg, transparent 328deg, transparent 360deg);
    animation: spin 36s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Drifting romantic mist */
  .mist {
    position: absolute; inset: 0; pointer-events: none; z-index: 1;
    background:
      radial-gradient(ellipse 50% 30% at 20% 70%, rgba(255,143,200,.18), transparent 70%),
      radial-gradient(ellipse 45% 28% at 80% 40%, rgba(255,215,106,.12), transparent 70%),
      radial-gradient(ellipse 40% 25% at 50% 20%, rgba(255,120,180,.1), transparent 70%);
    animation: mistDrift 14s ease-in-out infinite alternate;
  }
  @keyframes mistDrift {
    from { transform: translate3d(-2%, 1%, 0) scale(1); opacity: .7; }
    to { transform: translate3d(3%, -2%, 0) scale(1.08); opacity: 1; }
  }

  /* Constellation */
  .stars {
    position: absolute; inset: 0; z-index: 1; pointer-events: none; overflow: hidden;
  }
  .stars i {
    position: absolute;
    width: var(--sz, 3px); height: var(--sz, 3px);
    left: var(--x); top: var(--y);
    border-radius: 50%;
    background: #ffe9a8;
    box-shadow: 0 0 6px #ffd76a;
    opacity: .35;
    animation: twinkleStar 2.8s var(--delay) ease-in-out infinite;
  }
  @keyframes twinkleStar {
    0%, 100% { opacity: .2; transform: scale(.7); }
    50% { opacity: 1; transform: scale(1.35); }
  }

  .halo {
    position: absolute; left: 50%; top: 56%;
    width: min(78vw, 480px); height: min(78vw, 480px);
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,215,106,.55), rgba(255,95,162,.3) 42%, transparent 68%);
    animation: heartbeat 2.6s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes heartbeat {
    0%, 100% { opacity: .6; transform: translate(-50%, -50%) scale(1); }
    14% { opacity: .95; transform: translate(-50%, -50%) scale(1.08); }
    28% { opacity: .7; transform: translate(-50%, -50%) scale(1.02); }
    42% { opacity: 1; transform: translate(-50%, -50%) scale(1.12); }
    60% { opacity: .75; transform: translate(-50%, -50%) scale(1.04); }
  }

  .orbit {
    position: absolute; left: 50%; top: 56%;
    width: min(72vw, 440px); height: min(72vw, 440px);
    transform: translate(-50%, -50%);
    border-radius: 50%;
    border: 1px solid rgba(255,215,106,.18);
    pointer-events: none;
    animation: spin 22s linear infinite;
  }
  .orbit.slow {
    width: min(88vw, 560px); height: min(88vw, 560px);
    animation-duration: 34s; animation-direction: reverse;
    border-color: rgba(255,95,162,.15);
  }
  .orbit i {
    position: absolute; font-style: normal; font-size: 1.1rem;
    top: -.55rem; left: 50%; transform: translateX(-50%);
  }
  .orbit i:nth-child(2) { top: auto; bottom: -.55rem; }
  .orbit i:nth-child(3) { top: 50%; left: -.4rem; transform: translateY(-50%); }
  .orbit i:nth-child(4) { top: 50%; left: auto; right: -.4rem; transform: translateY(-50%); }

  /* CSS butterflies orbiting the bouquet */
  .fly-orbit {
    position: absolute; left: 50%; top: 54%;
    width: 0; height: 0; z-index: 4; pointer-events: none;
  }
  .fly-orbit b {
    position: absolute;
    font-style: normal; font-size: 1.15rem;
    offset-path: path('M0,-150 C95,-150 150,-70 150,0 C150,95 70,155 0,155 C-70,155 -150,95 -150,0 C-150,-70 -95,-150 0,-150');
    offset-distance: var(--start, 0%);
    offset-rotate: auto;
    animation: flyPath var(--dur, 16s) linear infinite;
    filter: drop-shadow(0 0 6px rgba(255,122,184,.7));
  }
  .fly-orbit b:nth-child(2) { --start: 33%; --dur: 19s; font-size: 1rem; animation-direction: reverse; }
  .fly-orbit b:nth-child(3) { --start: 66%; --dur: 22s; font-size: .95rem; }
  @keyframes flyPath { to { offset-distance: calc(var(--start) + 100%); } }

  #fx {
    position: absolute; inset: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 2;
  }
  #burst {
    position: fixed; inset: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 35; display: none;
  }

  .pop {
    position: fixed; z-index: 36; pointer-events: none;
    font-size: 1.4rem;
    animation: popFly .9s ease-out forwards;
    filter: drop-shadow(0 0 8px rgba(255, 95, 162, .8));
  }
  @keyframes popFly {
    0% { transform: translate(-50%, -50%) scale(.4); opacity: 1; }
    100% { transform: translate(var(--dx), var(--dy)) scale(1.3); opacity: 0; }
  }

  .ring {
    position: fixed; z-index: 34; pointer-events: none;
    width: 18px; height: 18px; margin: -9px 0 0 -9px;
    border-radius: 50%;
    border: 2px solid rgba(255, 143, 200, .9);
    box-shadow: 0 0 16px rgba(255, 95, 162, .55);
    animation: ringOut .85s ease-out forwards;
  }
  @keyframes ringOut {
    to { transform: scale(7); opacity: 0; }
  }

  .floaters {
    position: absolute; inset: 0; z-index: 3;
    pointer-events: none; overflow: hidden;
  }
  .floaters span {
    position: absolute; bottom: -6%;
    left: var(--x); font-size: var(--s); color: var(--c);
    animation: rise var(--d) var(--delay) linear infinite;
    will-change: transform, opacity; opacity: 0;
  }
  @keyframes rise {
    0% { transform: translate3d(0,0,0) rotate(0deg); opacity: 0; }
    10% { opacity: .85; }
    100% { transform: translate3d(var(--dx), -112vh, 0) rotate(340deg); opacity: 0; }
  }

  /* Whisper lines near bouquet */
  .whispers {
    position: absolute; inset: 0; z-index: 4; pointer-events: none;
  }
  .whispers em {
    position: absolute;
    font-style: italic;
    font-size: clamp(.95rem, 2.8vw, 1.2rem);
    color: rgba(255, 210, 230, .0);
    text-shadow: 0 0 12px rgba(255,95,162,.4);
    white-space: nowrap;
    animation: whisper 9s var(--delay) ease-in-out infinite;
  }
  .whispers em:nth-child(1) { left: 6%; top: 38%; --delay: 0s; }
  .whispers em:nth-child(2) { right: 6%; top: 46%; --delay: 3s; }
  .whispers em:nth-child(3) { left: 10%; top: 62%; --delay: 6s; }
  @keyframes whisper {
    0%, 15% { opacity: 0; transform: translateY(8px); }
    30%, 55% { opacity: .9; transform: translateY(0); color: rgba(255,210,230,.9); }
    75%, 100% { opacity: 0; transform: translateY(-8px); }
  }

  /* Love path steps */
  .path {
    display: flex; gap: .45rem; justify-content: center; align-items: center;
    margin-bottom: .45rem;
    opacity: 0; animation: fadeUp .7s 1.9s ease forwards;
  }
  .path span {
    width: 8px; height: 8px; border-radius: 50%;
    background: rgba(255,255,255,.25);
    box-shadow: 0 0 0 1px rgba(255,215,106,.25);
    transition: transform .3s, background .3s, box-shadow .3s;
  }
  .path span.on {
    background: var(--gold);
    box-shadow: 0 0 12px rgba(255,215,106,.7);
    transform: scale(1.25);
  }

  /* ========== UI ========== */
  .ui {
    position: relative; z-index: 5;
    height: 100%;
    display: grid;
    grid-template-rows: auto minmax(0, 1fr) auto;
    justify-items: center;
    padding:
      max(2.2vh, env(safe-area-inset-top, 0px))
      max(1rem, env(safe-area-inset-right, 0px))
      max(1.1rem, env(safe-area-inset-bottom, 0px))
      max(1rem, env(safe-area-inset-left, 0px));
    text-align: center;
    overflow-x: hidden;
    overflow-y: visible;
  }

  .header {
    position: relative; z-index: 6;
    padding: .75rem .75rem .4rem;
    margin-bottom: .2rem;
    max-width: 100%;
    overflow: visible;
  }
  .date {
    font-size: .78rem; letter-spacing: .42em; text-transform: uppercase;
    color: var(--blush); opacity: 0;
    animation: fadeUp .7s .2s ease forwards;
  }
  .title {
    margin: .2rem auto 0;
    padding: .55rem .6rem .65rem;
    font-family: 'Great Vibes', cursive;
    font-size: clamp(2.15rem, 7vw, 4.2rem);
    line-height: 1.55;
    display: block;
    max-width: 100%;
    overflow: visible;
    color: #ffe9a8;
    text-shadow:
      0 0 18px rgba(255, 95, 162, .55),
      0 0 28px rgba(255, 215, 106, .35),
      0 2px 0 rgba(0,0,0,.25);
    animation: titleGlow 3.5s ease-in-out infinite;
  }
  .title span {
    display: inline-block;
    color: inherit;
    opacity: 0;
    transform: translateY(12px);
    animation: letterIn .65s var(--delay) cubic-bezier(.2,1.2,.3,1) forwards;
    padding: .12em .03em;
    line-height: 1.55;
  }
  .title span.space { width: .28em; padding: 0; }
  @keyframes letterIn { to { opacity: 1; transform: none; } }
  @keyframes titleGlow {
    0%, 100% {
      text-shadow: 0 0 14px rgba(255,95,162,.45), 0 0 22px rgba(255,215,106,.3), 0 2px 0 rgba(0,0,0,.25);
      color: #ffe9a8;
    }
    50% {
      text-shadow: 0 0 26px rgba(255,95,162,.75), 0 0 40px rgba(255,215,106,.55), 0 2px 0 rgba(0,0,0,.25);
      color: #fff3c4;
    }
  }

  .vow {
    margin-top: .45rem;
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-size: clamp(1.2rem, 3.8vw, 1.85rem);
    color: #ffd0e6;
    text-shadow: 0 0 20px rgba(255,95,162,.55);
    opacity: 0;
    animation: fadeUp .8s 1.5s ease forwards, vowBeat 2.6s 2.3s ease-in-out infinite;
  }
  @keyframes vowBeat {
    0%, 100% { transform: scale(1); }
    14% { transform: scale(1.03); }
    28% { transform: scale(1.01); }
    42% { transform: scale(1.04); }
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(18px); }
    to { opacity: 1; transform: none; }
  }

  .flourish {
    position: absolute; top: 42%;
    font-size: clamp(1.4rem, 4vw, 2rem);
    color: var(--gold);
    opacity: 0;
    animation: fadeUp 1s 2s ease forwards, floatSoft 4s 3s ease-in-out infinite;
    pointer-events: none;
  }
  .flourish.l { left: 3vw; }
  .flourish.r { right: 3vw; animation-delay: 2.15s, 3.2s; }
  @keyframes floatSoft {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }

  .bouquet-wrap {
    width: 100%; min-height: 0; height: 100%;
    display: grid; place-items: center;
    opacity: 0;
    animation: fadeUp 1s 1.1s ease forwards;
    perspective: 900px;
    overflow: visible;
    padding: .35rem 0;
    transform-style: preserve-3d;
  }
  .bouquet {
    height: auto; width: auto;
    max-height: min(46vh, 100%);
    max-width: min(86vw, 360px);
    aspect-ratio: 440 / 590;
    overflow: visible;
    filter: drop-shadow(0 16px 24px rgba(0,0,0,.45));
    animation: bouquetDance 5s ease-in-out infinite;
    transform-origin: 50% 90%;
    will-change: transform;
  }
  @keyframes bouquetDance {
    0%, 100% { transform: translate3d(0,0,0) rotateY(-3deg) rotateZ(-1deg); }
    50% { transform: translate3d(0,-10px,0) rotateY(3deg) rotateZ(1deg); }
  }

  .sunflower { transform-box: fill-box; transform-origin: center; animation: sway 4.5s ease-in-out infinite, bloom 1.4s var(--bd, 1.2s) both; }
  .sunflower:nth-of-type(1) { --bd: 1.15s; animation-delay: 0s, 1.15s; }
  .sunflower:nth-of-type(2) { --bd: 1.35s; animation-delay: -1s, 1.35s; }
  .sunflower:nth-of-type(3) { --bd: 1s; animation-delay: -2s, 1s; }
  .sunflower:nth-of-type(4) { --bd: 1.5s; animation-delay: -2.8s, 1.5s; }
  .sunflower:nth-of-type(5) { --bd: 1.65s; animation-delay: -1.5s, 1.65s; }
  @keyframes sway {
    0%, 100% { transform: rotate(-3deg); }
    50% { transform: rotate(3deg); }
  }
  @keyframes bloom {
    from { transform: scale(0) rotate(-30deg); opacity: 0; }
    70% { transform: scale(1.1) rotate(4deg); opacity: 1; }
    to { transform: scale(1) rotate(0); opacity: 1; }
  }
  .wing { transform-box: fill-box; transform-origin: center; animation: flap .38s ease-in-out infinite alternate; }
  @keyframes flap { from { transform: scaleX(1); } to { transform: scaleX(.32); } }

  .bow {
    transform-box: fill-box; transform-origin: center top;
    animation: bowUntie 1.8s 1.6s cubic-bezier(.2,1.2,.3,1) both, bow 2.4s 3.5s ease-in-out infinite;
  }
  @keyframes bowUntie {
    0% { transform: scale(.4) rotate(-25deg); opacity: 0; }
    60% { transform: scale(1.15) rotate(8deg); opacity: 1; }
    100% { transform: scale(1) rotate(0); opacity: 1; }
  }
  @keyframes bow {
    0%, 100% { transform: translateY(0) rotate(-3deg); }
    50% { transform: translateY(-9px) rotate(3deg); }
  }
  .paper { transform-box: fill-box; transform-origin: 50% 0%; animation: paper 5.5s ease-in-out infinite; }
  @keyframes paper {
    0%, 100% { transform: rotate(-1.5deg); }
    50% { transform: rotate(1.8deg); }
  }
  .tw { animation: tw 1.6s ease-in-out infinite; }
  .tw:nth-child(2) { animation-delay: .3s; }
  .tw:nth-child(3) { animation-delay: .6s; }
  .tw:nth-child(4) { animation-delay: .9s; }
  @keyframes tw {
    0%, 100% { opacity: .25; transform: scale(.6); }
    50% { opacity: 1; transform: scale(1.5); }
  }

  .pearls {
    display: flex; gap: .5rem; justify-content: center; flex-wrap: wrap;
    margin-bottom: .75rem;
    padding: 0 .25rem;
    opacity: 0; animation: fadeUp .8s 2s ease forwards;
  }
  .pearl {
    appearance: none; border: 1px solid rgba(255,215,106,.35);
    background: rgba(255,255,255,.06);
    color: var(--cream);
    font-family: inherit; font-size: 1rem;
    min-height: 44px;
    padding: .65rem 1.05rem; border-radius: 999px; cursor: pointer;
    backdrop-filter: blur(4px);
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    transition: transform .2s, background .2s, box-shadow .2s;
  }
  .pearl:hover, .pearl.active {
    background: linear-gradient(135deg, rgba(255,215,106,.35), rgba(255,95,162,.35));
    box-shadow: 0 0 20px rgba(255,95,162,.35);
    transform: translateY(-2px);
  }

  .actions {
    display: flex; gap: .65rem; flex-wrap: wrap; justify-content: center;
    width: 100%;
    padding: 0 .25rem;
    opacity: 0; animation: fadeUp .8s 2.15s ease forwards;
  }
  .btn {
    appearance: none; border: 0; cursor: pointer;
    font-family: inherit; font-size: 1.1rem; font-weight: 600;
    min-height: 48px;
    padding: .75rem 1.3rem; border-radius: 999px;
    display: inline-flex; align-items: center; justify-content: center; gap: .45rem;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    transition: transform .2s;
  }
  .btn:active { transform: scale(.96); }
  .btn svg { width: 1.1rem; height: 1.1rem; fill: currentColor; }
  .btn-gold {
    background: linear-gradient(135deg, #fff3b0, #f0b429);
    color: var(--ink);
    box-shadow: 0 8px 22px rgba(240,180,41,.35);
  }
  .btn-rose {
    background: linear-gradient(135deg, #ff8ec8, var(--rose));
    color: #fff;
    box-shadow: 0 8px 26px rgba(255,95,162,.45);
    animation: glowBtn 2s ease-in-out infinite;
  }
  @keyframes glowBtn {
    0%, 100% { box-shadow: 0 8px 26px rgba(255,95,162,.45); }
    50% { box-shadow: 0 10px 34px rgba(255,95,162,.75), 0 0 36px rgba(255,215,106,.35); }
  }

  .toast {
    position: fixed; left: 50%;
    bottom: calc(6.25rem + env(safe-area-inset-bottom, 0px));
    z-index: 20;
    transform: translateX(-50%) translateY(20px);
    background: linear-gradient(135deg, rgba(40,10,30,.92), rgba(70,20,50,.92));
    border: 1px solid rgba(255,215,106,.35);
    color: var(--cream);
    padding: .85rem 1.15rem; border-radius: 1rem;
    font-size: 1.15rem; font-style: italic;
    max-width: min(92vw, 380px); text-align: center;
    opacity: 0; pointer-events: none;
    transition: opacity .35s, transform .35s;
    box-shadow: 0 12px 40px rgba(0,0,0,.4);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* Envelope modal */
  .modal {
    position: fixed; inset: 0; z-index: 40;
    display: grid; place-items: center;
    padding:
      max(1rem, env(safe-area-inset-top, 0px))
      max(1rem, env(safe-area-inset-right, 0px))
      max(1rem, env(safe-area-inset-bottom, 0px))
      max(1rem, env(safe-area-inset-left, 0px));
    background: rgba(10, 2, 16, .78);
    backdrop-filter: blur(10px);
    opacity: 0; pointer-events: none;
    transition: opacity .35s;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
  .modal.open { opacity: 1; pointer-events: auto; }
  .envelope {
    width: min(440px, 100%);
    position: relative;
    transform: scale(.85) translateY(24px);
    transition: transform .55s cubic-bezier(.2,1.25,.3,1);
  }
  .modal.open .envelope { transform: none; }
  .envelope-flap {
    height: 54px;
    background: linear-gradient(180deg, #ffd0e6, #f5b8d4);
    clip-path: polygon(0 0, 50% 100%, 100% 0);
    transform-origin: top center;
    transform: rotateX(0deg);
    transition: transform .7s cubic-bezier(.2,1.1,.3,1) .05s;
    filter: drop-shadow(0 4px 8px rgba(0,0,0,.2));
  }
  .modal.open .envelope-flap { transform: rotateX(180deg); opacity: .35; }
  .card {
    margin-top: -28px;
    background:
      radial-gradient(circle at 15% 0%, rgba(255,180,210,.5), transparent 40%),
      linear-gradient(160deg, #fff8e8, #ffe7f2 60%, #ffe9b8);
    color: var(--ink);
    border-radius: 0 0 1.4rem 1.4rem;
    padding: 2.1rem 1.5rem 1.4rem;
    text-align: center;
    box-shadow: 0 24px 60px rgba(0,0,0,.45);
    transform: translateY(-12px);
    opacity: 0;
    transition: transform .55s .25s cubic-bezier(.2,1.2,.3,1), opacity .4s .25s;
  }
  .modal.open .card { transform: none; opacity: 1; }
  .card h2 {
    font-family: 'Great Vibes', cursive;
    font-size: 2.4rem; font-weight: 400; color: #9a3d18;
    margin-bottom: .35rem;
  }
  .card .es-line {
    font-size: 1rem; font-style: italic; color: #a85570;
    margin-bottom: .7rem;
  }
  .card p {
    font-size: 1.28rem; line-height: 1.45; min-height: 6em; margin-bottom: 1.1rem;
  }
  .card .hearts-row {
    display: flex; justify-content: center; gap: .35rem;
    margin-bottom: .7rem; font-size: 1.1rem;
  }
  .card .hearts-row span { animation: bounceH 1.2s ease-in-out infinite; }
  .card .hearts-row span:nth-child(2) { animation-delay: .15s; }
  .card .hearts-row span:nth-child(3) { animation-delay: .3s; }
  .card .hearts-row span:nth-child(4) { animation-delay: .45s; }
  .card .hearts-row span:nth-child(5) { animation-delay: .6s; }
  @keyframes bounceH {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }
  .card button {
    appearance: none; border: 0; cursor: pointer;
    font-family: inherit; font-size: 1.1rem; font-weight: 600;
    min-height: 48px;
    padding: .7rem 1.35rem; border-radius: 999px;
    background: linear-gradient(135deg, #5a2040, var(--rose));
    color: var(--gold);
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }

  .letter-rain {
    position: fixed; inset: 0; z-index: 39; pointer-events: none;
    overflow: hidden; opacity: 0; transition: opacity .4s;
  }
  .letter-rain.on { opacity: 1; }
  .letter-rain i {
    position: absolute; top: -10%;
    left: var(--x); font-style: normal;
    font-size: var(--s); color: var(--c);
    animation: letterFall var(--d) var(--delay) linear infinite;
    opacity: .85;
  }
  @keyframes letterFall {
    to { transform: translate3d(var(--dx), 120vh, 0) rotate(360deg); opacity: 0; }
  }

  .ripple {
    position: fixed; width: 12px; height: 12px; border-radius: 50%;
    border: 2px solid var(--rose); pointer-events: none; z-index: 50;
    animation: rip .7s ease-out forwards;
  }
  @keyframes rip { to { transform: scale(8); opacity: 0; } }

  /* ========== MOBILE HARDENING ========== */
  @media (max-width: 700px) {
    .intro-card { padding: 1.25rem 1.1rem; }
    .intro h2 { font-size: clamp(2.2rem, 11vw, 3.2rem); }
    .intro .to-her { font-size: clamp(1.15rem, 5vw, 1.45rem); }
    .intro p.tag { letter-spacing: .18em; font-size: .85rem; }

    .whispers,
    .flourish,
    .orbit.slow,
    .fly-orbit b:nth-child(3) { display: none !important; }

    .halo {
      width: min(92vw, 360px);
      height: min(92vw, 360px);
      top: 58%;
    }
    .orbit {
      width: min(78vw, 320px);
      height: min(78vw, 320px);
      top: 58%;
    }
    .fly-orbit { top: 56%; }
    .fly-orbit b {
      offset-path: path('M0,-110 C70,-110 110,-50 110,0 C110,70 50,115 0,115 C-50,115 -110,70 -110,0 C-110,-50 -70,-110 0,-110');
    }

    .header { padding: .45rem .4rem .15rem; }
    .date { font-size: .68rem; letter-spacing: .28em; }
    .title {
      font-size: clamp(1.95rem, 9.5vw, 2.8rem);
      padding: .4rem .35rem .5rem;
      line-height: 1.5;
    }
    .vow {
      margin-top: .3rem;
      font-size: clamp(1.05rem, 4.6vw, 1.35rem);
      padding: 0 .4rem;
    }

    .bouquet {
      max-height: min(42vh, 100%);
      max-width: min(82vw, 300px);
    }

    .path { margin-bottom: .35rem; }
    .pearls { gap: .4rem; margin-bottom: .55rem; }
    .pearl {
      font-size: .95rem;
      padding: .55rem .9rem;
      flex: 1 1 calc(50% - .5rem);
      max-width: calc(50% - .4rem);
    }
    .actions {
      flex-direction: column;
      align-items: stretch;
      gap: .55rem;
      max-width: 320px;
      margin: 0 auto;
    }
    .btn { width: 100%; }

    .toast {
      bottom: calc(7.5rem + env(safe-area-inset-bottom, 0px));
      font-size: 1.05rem;
      padding: .75rem 1rem;
    }

    .card {
      padding: 1.6rem 1.15rem 1.2rem;
      border-radius: 0 0 1.15rem 1.15rem;
    }
    .card h2 { font-size: 2.05rem; }
    .card p { font-size: 1.12rem; min-height: 5.2em; }
    .card .es-line { font-size: .95rem; }
  }

  @media (max-width: 700px) and (max-height: 720px) {
    .title { font-size: clamp(1.75rem, 8vw, 2.3rem); padding: .25rem .3rem .35rem; }
    .vow { font-size: 1.05rem; margin-top: .2rem; }
    .bouquet { max-height: min(36vh, 100%); }
    .date { display: none; }
    .path { display: none; }
  }

  @media (orientation: landscape) and (max-height: 500px) {
    .whispers, .flourish, .orbit, .fly-orbit, .mist, .stars, .path { display: none !important; }
    .intro-card { padding: 1rem; }
    .intro-seal { width: 64px; height: 64px; font-size: 1.5rem; margin-bottom: .5rem; }
    .ui {
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr auto;
      padding: .5rem max(.75rem, env(safe-area-inset-right, 0px)) .5rem max(.75rem, env(safe-area-inset-left, 0px));
      align-items: center;
    }
    .header { grid-column: 1; grid-row: 1; padding: .25rem; }
    .bouquet-wrap { grid-column: 2; grid-row: 1 / span 2; }
    .bouquet { max-height: 78vh; max-width: 42vw; }
    footer {
      grid-column: 1;
      grid-row: 2;
      width: 100%;
    }
    .title { font-size: clamp(1.5rem, 5vw, 2.2rem); }
    .vow { font-size: 1rem; }
    .pearl { flex: 1 1 auto; max-width: none; min-height: 40px; padding: .45rem .7rem; }
    .actions { flex-direction: row; max-width: none; }
    .btn { width: auto; min-height: 42px; padding: .55rem 1rem; font-size: 1rem; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition: none !important; }
    .date, .title span, .vow, .bouquet-wrap, .actions, .pearls, .flourish, .path { opacity: 1; transform: none; }
  }
</style>
</head>
<body>

<div class="intro" id="intro">
  <div class="curtain left"></div>
  <div class="curtain right"></div>
  <div class="intro-card">
    <div class="intro-seal">Z</div>
    <h2>Para ti</h2>
    <p class="to-her">Zully, mi principessa</p>
    <p class="tag">a love note awaits</p>
    <button class="intro-btn" id="openIntro" type="button">Abrir con cariño ♡</button>
  </div>
</div>

<div class="stage" id="stage">
  <div class="bg"></div>
  <div class="mist" aria-hidden="true"></div>
  <div class="stars" id="stars" aria-hidden="true"></div>
  <div class="halo"></div>
  <div class="orbit"><i>♡</i><i>✦</i><i>❀</i><i>💛</i></div>

  <canvas id="fx"></canvas>
  <div class="floaters" id="floaters"></div>
  <div class="whispers" aria-hidden="true">
    <em>for Zully…</em>
    <em>te amo…</em>
    <em>always yours…</em>
  </div>

  <div class="ui">
    <header class="header">
      <p class="date">21 · septiembre · con amor</p>
      <h1 class="title" id="title" aria-label="Flores Amarillas"></h1>
      <p class="vow">Te amo mucho, mi principessa ♡</p>
      <span class="flourish l">❧</span>
      <span class="flourish r">❧</span>
    </header>

    <div class="bouquet-wrap" id="bouquetWrap">
      <svg class="bouquet" id="bouquet" viewBox="-20 -45 440 590" overflow="visible" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ramo de girasoles">
        <defs>
          <path id="petal" d="M0,0 C-9,-14 -9,-34 0,-46 C9,-34 9,-14 0,0 Z"/>
          <linearGradient id="petalG" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#ffb800"/><stop offset="1" stop-color="#ffe14d"/>
          </linearGradient>
          <radialGradient id="centerG" cx="50%" cy="45%" r="60%">
            <stop offset="0" stop-color="#6b3d17"/><stop offset=".6" stop-color="#3e2210"/><stop offset="1" stop-color="#22110a"/>
          </radialGradient>
          <linearGradient id="paperA" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#f7b8d6"/><stop offset="1" stop-color="#c79be0"/>
          </linearGradient>
          <linearGradient id="paperB" x1="1" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#e6b1f0"/><stop offset="1" stop-color="#b98ad9"/>
          </linearGradient>
          <linearGradient id="ribbonG" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#ffb347"/><stop offset="1" stop-color="#f08a00"/>
          </linearGradient>
          <g id="sf">
            <g fill="url(#petalG)" stroke="#d69a00" stroke-width=".8">
              <use href="#petal" transform="rotate(0)"/><use href="#petal" transform="rotate(20)"/>
              <use href="#petal" transform="rotate(40)"/><use href="#petal" transform="rotate(60)"/>
              <use href="#petal" transform="rotate(80)"/><use href="#petal" transform="rotate(100)"/>
              <use href="#petal" transform="rotate(120)"/><use href="#petal" transform="rotate(140)"/>
              <use href="#petal" transform="rotate(160)"/><use href="#petal" transform="rotate(180)"/>
              <use href="#petal" transform="rotate(200)"/><use href="#petal" transform="rotate(220)"/>
              <use href="#petal" transform="rotate(240)"/><use href="#petal" transform="rotate(260)"/>
              <use href="#petal" transform="rotate(280)"/><use href="#petal" transform="rotate(300)"/>
              <use href="#petal" transform="rotate(320)"/><use href="#petal" transform="rotate(340)"/>
            </g>
            <g fill="#ffd21f" opacity=".9">
              <use href="#petal" transform="rotate(10) scale(.85)"/><use href="#petal" transform="rotate(50) scale(.85)"/>
              <use href="#petal" transform="rotate(90) scale(.85)"/><use href="#petal" transform="rotate(130) scale(.85)"/>
              <use href="#petal" transform="rotate(170) scale(.85)"/><use href="#petal" transform="rotate(210) scale(.85)"/>
              <use href="#petal" transform="rotate(250) scale(.85)"/><use href="#petal" transform="rotate(290) scale(.85)"/>
              <use href="#petal" transform="rotate(330) scale(.85)"/>
            </g>
            <circle r="21" fill="url(#centerG)" stroke="#2a150a" stroke-width="1.5"/>
          </g>
          <path id="leaf" d="M0,0 C22,-16 46,-10 56,6 C40,20 16,16 0,0 Z" fill="#2e8b3d" stroke="#1f6a2c" stroke-width="1.2"/>
          <g id="bfly">
            <g class="wing"><path d="M0,0 C-14,-18 -26,-8 -20,4 C-16,12 -6,10 0,0 Z" fill="#ff7ab8"/></g>
            <g class="wing"><path d="M0,0 C14,-18 26,-8 20,4 C16,12 6,10 0,0 Z" fill="#ff7ab8"/></g>
            <path d="M0,-6 L0,10" stroke="#3a1a3a" stroke-width="2" stroke-linecap="round"/>
          </g>
        </defs>
        <g stroke="#2a8a3a" stroke-width="7" stroke-linecap="round" fill="none">
          <path d="M200,330 C190,270 130,230 112,170"/>
          <path d="M200,330 C200,260 200,200 200,120"/>
          <path d="M200,330 C215,270 275,235 292,175"/>
          <path d="M200,330 C180,290 150,290 128,262"/>
          <path d="M200,330 C222,290 250,290 274,258"/>
        </g>
        <use href="#leaf" transform="translate(190 300) rotate(200) scale(1.1)"/>
        <use href="#leaf" transform="translate(212 296) rotate(-20) scale(1.1)"/>
        <use href="#leaf" transform="translate(160 240) rotate(215) scale(.9)"/>
        <use href="#leaf" transform="translate(242 236) rotate(-35) scale(.9)"/>
        <g class="sunflower"><use href="#sf" transform="translate(112 168) scale(.95)"/></g>
        <g class="sunflower"><use href="#sf" transform="translate(292 172) scale(.95)"/></g>
        <g class="sunflower"><use href="#sf" transform="translate(200 108) scale(1.15)"/></g>
        <g class="sunflower"><use href="#sf" transform="translate(128 258) scale(.8)"/></g>
        <g class="sunflower"><use href="#sf" transform="translate(274 256) scale(.8)"/></g>
        <g transform="translate(316 132) scale(1.15) rotate(15)"><use href="#bfly"/></g>
        <g transform="translate(160 62) scale(.9) rotate(-20)"><use href="#bfly"/></g>
        <g class="paper">
          <path d="M70,300 C130,290 270,290 330,300 L262,486 C230,496 170,496 138,486 Z" fill="url(#paperB)" stroke="#a877cf" stroke-width="2"/>
          <path d="M92,296 L200,340 L308,296 L262,486 C230,496 170,496 138,486 Z" fill="url(#paperA)" stroke="#d68bb8" stroke-width="2"/>
          <g fill="#fff">
            <circle class="tw" cx="150" cy="380" r="3"/>
            <circle class="tw" cx="250" cy="392" r="3"/>
            <circle class="tw" cx="200" cy="420" r="3"/>
            <circle class="tw" cx="175" cy="450" r="2.5"/>
          </g>
        </g>
        <g class="bow" transform="translate(200 402)">
          <path d="M0,0 C-30,-30 -74,-30 -70,-2 C-68,24 -30,20 0,0 Z" fill="url(#ribbonG)" stroke="#c96a00" stroke-width="1.5"/>
          <path d="M0,0 C30,-30 74,-30 70,-2 C68,24 30,20 0,0 Z" fill="url(#ribbonG)" stroke="#c96a00" stroke-width="1.5"/>
          <path d="M-6,4 C-24,30 -40,56 -46,86 L-24,78 L-14,96 C-8,64 0,36 6,8 Z" fill="#f59a12" stroke="#c96a00" stroke-width="1.2"/>
          <path d="M6,4 C24,30 40,56 46,86 L24,78 L14,96 C8,64 0,36 -6,8 Z" fill="#ffc94a" stroke="#c96a00" stroke-width="1.2"/>
          <ellipse rx="15" ry="13" fill="#ffc94a" stroke="#c96a00" stroke-width="1.5"/>

      </svg>
    </div>

    <footer>
      <div class="path" id="path" aria-hidden="true"><span class="on"></span><span></span><span></span></div>
      <div class="pearls" id="pearls">
        <button class="pearl" type="button" data-msg="Your smile is my favorite kind of sunlight, Zully ☀️" data-step="1">Smile</button>
        <button class="pearl" type="button" data-msg="Even the quiet moments with you feel like poetry 💛" data-step="1">Softly</button>
        <button class="pearl" type="button" data-msg="My heart keeps finding its way back to you ♡" data-step="1">Us</button>
        <button class="pearl" type="button" data-msg="Forever with you is the only timeline I want 🌻" data-step="1">Forever</button>
      </div>
      <div class="actions">
        <button class="btn btn-gold" id="music" type="button">
          <svg id="icoPlay" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          <svg id="icoPause" viewBox="0 0 24 24" hidden><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
          <span id="musicLabel">Música</span>

          <svg viewBox="0 0 24 24"><path d="M20 7h-2.2A3 3 0 0 0 12 4.6 3 3 0 0 0 6.2 7H4a1 1 0 0 0-1 1v3h18V8a1 1 0 0 0-1-1zM9 7a1 1 0 1 1 1 1H9zm6 0v1h-1a1 1 0 1 1 1-1zM4 13v6a1 1 0 0 0 1 1h6v-7zm9 0v7h6a1 1 0 0 0 1-1v-6z"/></svg>
          Open my letter

<canvas id="burst"></canvas>
<div class="toast" id="toast"></div>
<div class="letter-rain" id="letterRain" aria-hidden="true"></div>

<div class="modal" id="modal" role="dialog" aria-modal="true">
  <div class="envelope">
    <div class="envelope-flap" aria-hidden="true"></div>
    <div class="card">
      <div class="hearts-row" aria-hidden="true"><span>♡</span><span>💛</span><span>♡</span><span>🌻</span><span>♡</span></div>
      <h2>For you, Zully</h2>
      <p class="es-line">Con todo mi cariño…</p>
      <p id="dedication"></p>
      <button id="close" type="button">De parte de tu monito Rafael</button>
    </div>
  </div>
</div>

<script>
(() => {
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const low = (navigator.hardwareConcurrency || 8) <= 4;
  const mobile = matchMedia('(max-width: 700px)').matches;
  const coarse = matchMedia('(pointer: coarse)').matches;

  /* Title letters */
  const titleEl = document.getElementById('title');
  [...'Flores Amarillas'].forEach((ch, i) => {
    const s = document.createElement('span');
    if (ch === ' ') s.className = 'space';
    else s.textContent = ch;
    s.style.setProperty('--delay', (0.35 + i * 0.06) + 's');
    titleEl.appendChild(s);
  });

  /* Stars */
  const stars = document.getElementById('stars');
  if (!reduce) {
    for (let i = 0; i < (mobile || low ? 12 : 28); i++) {
      const el = document.createElement('i');
      el.style.setProperty('--x', Math.random() * 100 + '%');
      el.style.setProperty('--y', Math.random() * 100 + '%');
      el.style.setProperty('--sz', (2 + Math.random() * 3) + 'px');
      el.style.setProperty('--delay', (Math.random() * 3) + 's');
      stars.appendChild(el);
    }
  }

  /* Letter rain petals (CSS, only while letter open) */
  const letterRain = document.getElementById('letterRain');
  const rainGlyphs = ['❀', '♡', '✦', '💛', '✿'];
  const rainColors = ['#ffd76a', '#ff8ec8', '#ffe9a0', '#ff5fa2'];
  for (let i = 0; i < (mobile || low ? 10 : 18); i++) {
    const el = document.createElement('i');
    el.textContent = rainGlyphs[i % rainGlyphs.length];
    el.style.setProperty('--x', Math.random() * 100 + '%');
    el.style.setProperty('--s', (12 + Math.random() * 16) + 'px');
    el.style.setProperty('--d', (5 + Math.random() * 5) + 's');
    el.style.setProperty('--delay', (-Math.random() * 6) + 's');
    el.style.setProperty('--c', rainColors[i % rainColors.length]);
    el.style.setProperty('--dx', ((Math.random() - .5) * 60) + 'px');
    letterRain.appendChild(el);
  }

  /* Music first so intro can start it */
  const audio = new Audio('flores.mp3.mp3');
  audio.loop = true; audio.volume = .7;
  let playing = false;
  const icoPlay = document.getElementById('icoPlay');
  const icoPause = document.getElementById('icoPause');
  const musicLabel = document.getElementById('musicLabel');
  function setMusicUI(on) {
    playing = on;
    icoPlay.hidden = on;
    icoPause.hidden = !on;
    musicLabel.textContent = on ? 'Pausar' : 'Música';
  }
  function startMusic() {
    audio.play().then(() => setMusicUI(true)).catch(() => setMusicUI(false));
  }
  function stopMusic() { audio.pause(); setMusicUI(false); }
  document.getElementById('music').onclick = () => playing ? stopMusic() : startMusic();

  /* Intro → stage */
  const intro = document.getElementById('intro');
  const stage = document.getElementById('stage');
  const pathDots = [...document.querySelectorAll('#path span')];
  let started = false;
  let loveStep = 0;
  function setStep(n) {
    loveStep = Math.max(loveStep, n);
    pathDots.forEach((d, i) => d.classList.toggle('on', i <= loveStep));
  }

  function startExperience() {
    if (started) return;
    started = true;
    intro.classList.add('gone');
    stage.classList.add('on');
    setStep(0);
    startMusic();
    if (!fxRunning && !reduce) {
      fxRunning = true;
      requestAnimationFrame(loop);
    }
  }
  document.getElementById('openIntro').onclick = startExperience;

  /* Floaters */
  const floaters = document.getElementById('floaters');
  if (!reduce) {
    const glyphs = ['♡', '❀', '✦', '💛', '✧', '✿'];
    const colors = ['#ff7ab8', '#ffd76a', '#ffb3d4', '#ffe9a0', '#ff5fa2'];
    for (let i = 0; i < (mobile || low ? 8 : 14); i++) {
      const el = document.createElement('span');
      el.textContent = glyphs[i % glyphs.length];
      el.style.setProperty('--x', (3 + Math.random() * 94) + '%');
      el.style.setProperty('--s', (13 + Math.random() * 16) + 'px');
      el.style.setProperty('--d', (8 + Math.random() * 7) + 's');
      el.style.setProperty('--delay', (-Math.random() * 10) + 's');
      el.style.setProperty('--c', colors[i % colors.length]);
      el.style.setProperty('--dx', ((Math.random() - .5) * 50) + 'px');
      floaters.appendChild(el);
    }
  }

  /* Canvas FX — light */
  const fx = document.getElementById('fx');
  const burst = document.getElementById('burst');
  const ctx = fx.getContext('2d', { alpha: true, desynchronized: true });
  const bctx = burst.getContext('2d', { alpha: true, desynchronized: true });
  let W = 0, H = 0, live = true, last = 0, fxRunning = false;

  function resize() {
    W = fx.width = burst.width = innerWidth;
    H = fx.height = burst.height = innerHeight;
  }
  addEventListener('resize', resize, { passive: true });
  resize();
  document.addEventListener('visibilitychange', () => {
    live = !document.hidden;
    if (live && fxRunning) requestAnimationFrame(loop);
  });

  const sparkN = reduce ? 0 : (mobile || low ? 12 : 22);
  const petalN = reduce ? 0 : (mobile || low ? 8 : 14);
  const sparks = Array.from({ length: sparkN }, () => ({
    x: Math.random(), y: Math.random(), r: 1 + Math.random() * 1.6,
    s: .00015 + Math.random() * .00028, p: Math.random() * 6, t: .01 + Math.random() * .02
  }));
  const pCols = ['#ffe14d', '#ffb800', '#ff8ec8', '#ffd76a', '#ff5fa2'];
  const petals = Array.from({ length: petalN }, () => rp({}));
  function rp(p) {
    p.x = Math.random(); p.y = -Math.random() * .25;
    p.vy = .0005 + Math.random() * .0008;
    p.vx = (Math.random() - .5) * .00045;
    p.rot = Math.random() * 6; p.vr = (Math.random() - .5) * .035;
    p.w = 9 + Math.random() * 11; p.h = 12 + Math.random() * 12;
    p.a = .5 + Math.random() * .35;
    p.c = pCols[(Math.random() * pCols.length) | 0];
    return p;
  }

  function loop(t) {
    if (!live || !fxRunning) return;
    if (t - last < 33) { requestAnimationFrame(loop); return; }
    last = t;
    ctx.clearRect(0, 0, W, H);
    for (let i = 0; i < sparks.length; i++) {
      const p = sparks[i];
      p.y -= p.s; if (p.y < 0) { p.y = 1; p.x = Math.random(); }
      p.p += p.t;
      ctx.globalAlpha = .28 + .55 * Math.abs(Math.sin(p.p));
      ctx.fillStyle = '#ffe9a8';
      ctx.beginPath();
      ctx.arc(p.x * W, p.y * H, p.r, 0, 6.2832);
      ctx.fill();
    }
    for (let i = 0; i < petals.length; i++) {
      const p = petals[i];
      p.y += p.vy;
      p.x += p.vx + Math.sin(t * .0014 + p.rot) * .00022;
      p.rot += p.vr;
      if (p.y > 1.12) rp(p);
      ctx.save();
      ctx.translate(p.x * W, p.y * H);
      ctx.rotate(p.rot);
      ctx.globalAlpha = p.a;
      ctx.fillStyle = p.c;
      ctx.beginPath();
      ctx.moveTo(0, -p.h * .5);
      ctx.quadraticCurveTo(p.w * .42, 0, 0, p.h * .5);
      ctx.quadraticCurveTo(-p.w * .42, 0, 0, -p.h * .5);
      ctx.fill();
      ctx.restore();
    }
    ctx.globalAlpha = 1;
    requestAnimationFrame(loop);
  }

  /* Softer tilt on phones so it doesn't jump around */
  const wrap = document.getElementById('bouquetWrap');
  let tx = 0, ty = 0, cx = 0, cy = 0;
  const tiltAmt = coarse || mobile ? 8 : 18;
  const tiltY = coarse || mobile ? 4 : 10;
  addEventListener('pointermove', e => {
    if (reduce || !started) return;
    tx = (e.clientX / innerWidth - .5) * tiltAmt;
    ty = (e.clientY / innerHeight - .5) * tiltY;
  }, { passive: true });
  (function parallax() {
    cx += (tx - cx) * .08;
    cy += (ty - cy) * .08;
    if (started) {
      const ry = coarse || mobile ? cx * .2 : cx * .4;
      const rx = coarse || mobile ? -cy * .15 : -cy * .3;
      wrap.style.transform = `translate3d(${cx * .35}px,${cy * .35}px,0) rotateY(${ry}deg) rotateX(${rx}deg)`;
    }
    requestAnimationFrame(parallax);
  })();

  addEventListener('pointerdown', e => {
    if (reduce) return;
    const r = document.createElement('div');
    r.className = 'ripple';
    r.style.left = (e.clientX - 6) + 'px';
    r.style.top = (e.clientY - 6) + 'px';
    document.body.appendChild(r);
    setTimeout(() => r.remove(), 700);
  });

  let bits = [], bustOn = false, typer = null;
  const bCols = ['#ffe14d', '#ffb800', '#ff5fa2', '#ffb3d4', '#ffffff', '#c79be0', '#ff8ec8'];

  function tick() {
    bctx.clearRect(0, 0, W, H);
    let alive = 0;
    for (let i = 0; i < bits.length; i++) {
      const p = bits[i];
      if (p.life <= 0 || p.y > H + 60) continue;
      alive++;
      p.vy += p.g; p.vx *= .985;
      p.x += p.vx; p.y += p.vy; p.rot += p.vr;
      p.life -= (p.fade || .008);
      bctx.save();
      bctx.translate(p.x, p.y);
      bctx.rotate(p.rot);
      bctx.globalAlpha = Math.max(p.life, 0);
      bctx.fillStyle = p.c;
      if (p.heart) {
        const s = p.w;
        bctx.beginPath();
        bctx.moveTo(0, s * .25);
        bctx.bezierCurveTo(-s, -s * .4, -s * 1.2, s * .4, 0, s * 1.15);
        bctx.bezierCurveTo(s * 1.2, s * .4, s, -s * .4, 0, s * .25);
        bctx.fill();
      } else {
        bctx.beginPath();
        bctx.moveTo(0, -p.h * .5);
        bctx.quadraticCurveTo(p.w * .45, 0, 0, p.h * .5);
        bctx.quadraticCurveTo(-p.w * .45, 0, 0, -p.h * .5);
        bctx.fill();
      }
      bctx.restore();
    }
    if (alive) requestAnimationFrame(tick);
    else {
      bustOn = false; bits.length = 0;
      bctx.clearRect(0, 0, W, H);
      burst.style.display = 'none';
    }
  }
  function startBurst() {
    burst.style.display = 'block';
    if (!bustOn) { bustOn = true; requestAnimationFrame(tick); }
  }

  const toast = document.getElementById('toast');
  let toastTimer;
  document.getElementById('pearls').onclick = e => {
    const btn = e.target.closest('.pearl');
    if (!btn) return;
    document.querySelectorAll('.pearl').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    toast.textContent = btn.dataset.msg;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 2800);
    setStep(1);
    const rect = btn.getBoundingClientRect();
    const x = rect.left + rect.width / 2;
    const y = rect.top + rect.height / 2;
    miniBurst(x, y);
    const ring = document.createElement('div');
    ring.className = 'ring';
    ring.style.left = x + 'px';
    ring.style.top = y + 'px';
    document.body.appendChild(ring);
    setTimeout(() => ring.remove(), 900);
  };

  function miniBurst(x, y) {
    for (let i = 0; i < 42; i++) {
      const angle = -Math.PI / 2 + (Math.random() - .5) * 2.2;
      const speed = 4 + Math.random() * 7;
      bits.push({
        x: x + (Math.random() - .5) * 10,
        y: y + (Math.random() - .5) * 6,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        g: .22, w: 8 + Math.random() * 10, h: 10 + Math.random() * 12,
        rot: Math.random() * 6, vr: (Math.random() - .5) * .25,
        c: bCols[(Math.random() * bCols.length) | 0],
        life: 1, fade: .006 + Math.random() * .004, heart: i % 2 === 0
      });
    }
    startBurst();
    const glyphs = ['♡', '💛', '❀', '✨', '💕', '🌻'];
    for (let i = 0; i < 10; i++) {
      const el = document.createElement('span');
      el.className = 'pop';
      el.textContent = glyphs[i % glyphs.length];
      el.style.left = x + 'px';
      el.style.top = y + 'px';
      el.style.fontSize = (1.1 + Math.random() * 1.1) + 'rem';
      el.style.setProperty('--dx', ((Math.random() - .5) * 140) + 'px');
      el.style.setProperty('--dy', (-40 - Math.random() * 120) + 'px');
      el.style.animationDelay = (i * 0.03) + 's';
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 1000);
    }
  }

  const modal = document.getElementById('modal');
  const dedication = document.getElementById('dedication');
  const note = 'Zully, my love — every yellow flower today is a promise from my heart to yours. Thank you for your smile, your warmth, and the way you make ordinary days feel like forever. Loving you is the most beautiful part of my life. I love you more than words can hold.';

  function fireworks() {
    const n = low ? 90 : 130;
    for (let i = 0; i < n; i++) {
      const left = i % 2 === 0;
      bits.push({
        x: (left ? .1 : .9) * W, y: H * .92,
        vx: (left ? 1 : -1) * (2.5 + Math.random() * 8),
        vy: -(9 + Math.random() * 14),
        g: .32, w: 7 + Math.random() * 8, h: 8 + Math.random() * 8,
        rot: Math.random() * 6, vr: (Math.random() - .5) * .3,
        c: bCols[(Math.random() * bCols.length) | 0],
        life: 1, fade: .007, heart: i % 4 === 0
      });
    }
    startBurst();
  }

  function typeNote() {
    dedication.textContent = '';
    let i = 0; clearInterval(typer);
    typer = setInterval(() => {
      dedication.textContent = note.slice(0, ++i);
      if (i >= note.length) clearInterval(typer);
    }, 20);
  }

  document.getElementById('gift').onclick = () => {
    setStep(2);
    fireworks(); setTimeout(fireworks, 350);
    modal.classList.add('open');
    letterRain.classList.add('on');
    typeNote();
  };
  function close() {
    modal.classList.remove('open');
    letterRain.classList.remove('on');
    clearInterval(typer);
  }
  document.getElementById('close').onclick = close;
  modal.onclick = e => { if (e.target === modal) close(); };
  addEventListener('keydown', e => { if (e.key === 'Escape') close(); });
})();
</script>
</body>
</html>
